<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Web Roaster</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="../icons/icon-48.png" alt="Icon" class="brand-icon">
        <div>
          <h1 class="brand-title">AI Web Roaster</h1>
          <p class="brand-subtitle">Real-time Webpage Roaster</p>
        </div>
      </div>
    </header>

    <!-- Main Action Buttons -->
    <section class="actions-section">
      <button id="btn-instant-roast" class="btn btn-roast">
        <span class="btn-icon">🔥</span>
        <span>Roast Webpage Now!</span>
      </button>
    </section>

    <!-- Roaster Settings Card -->
    <section class="settings-card">
      <h2 class="card-title">🔥 AI Roaster Settings</h2>

      <!-- Toggle Switch for Auto Roaster -->
      <div class="form-group row-between">
        <label for="roast-toggle">Auto-Roast Pop-ups</label>
        <label class="toggle-switch">
          <input type="checkbox" id="roast-toggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- Roast Interval Slider (1 to 10 Minutes) -->
      <div class="form-group">
        <div class="label-row">
          <label for="roast-interval-slider">Pop-up Interval</label>
          <span id="roast-interval-val" class="val-badge">5 min</span>
        </div>
        <input type="range" id="roast-interval-slider" min="1" max="10" step="1" value="5" class="range-slider">
      </div>
    </section>

    <!-- Footer -->
    <footer class="popup-footer">
      <span class="shortcut-pill">Hotkey: <strong>Alt + R</strong></span>
      <span>v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
